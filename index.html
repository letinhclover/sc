<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sống Chuẩn</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sống Chuẩn">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%23101a22'/%3E%3Ccircle cx='256' cy='256' r='180' fill='none' stroke='%236fd3b0' stroke-width='32' stroke-dasharray='800' stroke-dashoffset='150'/%3E%3Cpath d='M200 260 L240 300 L320 210' fill='none' stroke='%236fd3b0' stroke-width='36' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#101a22;--card:#17242e;--tx:#e9f0f5;--mu:#93a6b5;--ac:#6fd3b0;--bd:#263745;--wn:#f0b45a;--on:#0c1a14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f3f7f9;--card:#fff;--tx:#14212b;--mu:#587082;--ac:#0f8f69;--bd:#dce5ea;--wn:#a96a0c;--on:#fff}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 16px 96px}
.header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:15px;font-weight:700;color:var(--mu);margin:0}
h2{font-size:17px;margin:22px 0 8px}
.big{font-size:52px;font-weight:800;line-height:1.05;letter-spacing:-1.5px}.big small{font-size:22px;font-weight:500;color:var(--mu);margin-left:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}
.mu{color:var(--mu);font-size:13px}.up{color:var(--wn);font-weight:700}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1;min-width:0}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:4px 0 10px}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--ac);color:var(--on);font-weight:700;cursor:pointer}
button:active{opacity:.6}button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.w{background:transparent;color:var(--wn);border:1px solid var(--wn)}
.th{padding:6px 12px;border-radius:20px;font-size:14px;background:var(--card);border:1px solid var(--bd);color:var(--tx)}
label.hab{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}label.hab:first-of-type{border-top:0}
label.hab input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;text-align:left;border-top:1px solid var(--bd)}th{color:var(--mu);font-weight:500;border-top:0}
summary{cursor:pointer;color:var(--ac);font-weight:600}svg{width:100%;height:auto;display:block}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--bd)}.tag.good{background:rgba(111,211,176,.2);color:var(--ac)}.tag.alert{background:rgba(240,180,90,.2);color:var(--wn)}
.tip{border-left:3px solid var(--ac);padding:8px 12px;margin:8px 0;font-size:14px}.tip.no{border-color:var(--wn)}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);background:var(--ac);color:var(--on);padding:10px 18px;border-radius:20px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200;max-width:90%;text-align:center}#toast.on{opacity:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:99}
nav button{flex:1;background:transparent;color:var(--mu);border-radius:0;padding:12px 2px;font-size:13px;font-weight:600}nav button.on{color:var(--ac)}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const K='songchuan_v31',$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>ymd(new Date());
const sd=k=>k?k.split('-').reverse().join('/'):'';
const WD=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
const dl=k=>WD[new Date(k+'T12:00:00').getDay()]+', '+sd(k);
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const ni=v=>{const s=String(v==null?'':v).replace(/[^\d]/g,'');return s?parseInt(s,10):null};
const nf=v=>{const x=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(x)?null:x};
const fN=n=>Math.round(n).toLocaleString('vi-VN');
const HAB={water:'Uống đủ nước',veg:'Rau ở cả 2 bữa',walk:'Đi bộ 30 phút',early:'Ăn xong trước 20h'};
const LAB=[['a1c','HbA1c','%',0,5.6],['glu','Đường huyết đói','mg/dL',70,99],['tg','Triglycerid','mg/dL',0,149],['tc','Cholesterol','mg/dL',0,199],['ldl','LDL','mg/dL',0,129],['hdl','HDL','mg/dL',60,999],['alt','ALT','U/L',0,45],['ast','AST','U/L',0,37],['ggt','GGT','U/L',0,55],['cre','Creatinin','mg/dL',.6,1.2],['ua','Acid uric','mg/dL',3.7,7],['vd','Vitamin D','ng/mL',30,100]];
const DEF=()=>({v:4,dob:'1986-12-16',h:160,tg:60,sw:65,sd:'2026-10-04',sg:7000,eat:['11:00','20:00'],
 note:'Không bia rượu. Hút thuốc (chủ yếu thuốc lào). Ăn 2 bữa/ngày, nhiều thịt, ít rau. Lái xe ~100 phút/ngày, ít vận động. Ngủ 0h-7h cộng ngủ trưa 1-2h, có ngáy.',
 log:{'2026-10-04':{w:65,b:86,steps:null,act:null,h:[]}},
 labs:[{d:'2026-08-30',v:{a1c:5.9,glu:91,tg:240,tc:227,ldl:135,hdl:45,alt:34,ast:25,ggt:43,cre:.98,ua:7.1,vd:28}}]});
let S=null,tab='h',bad=false,del=false,curDate=today(),tt,theme='dark';
try{theme=localStorage.getItem('sc_theme')||'dark'}catch(e){}
function applyTheme(t){theme=t;document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('sc_theme',t)}catch(e){}}
applyTheme(theme);
function toggleTheme(){applyTheme(theme==='dark'?'light':'dark');render()}
try{S=JSON.parse(localStorage.getItem(K)||localStorage.getItem('canbang_v26'))}catch(e){}
const valid=o=>!!(o&&o.log&&o.labs&&o.h>0&&o.dob&&o.eat);
if(!valid(S))S=DEF();
S.v=4;S.sg=S.sg||7000;if(!/thuốc/i.test(S.note||''))S.note=(S.note||'')+' Hút thuốc (chủ yếu thuốc lào).';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));bad=false}catch(e){bad=true}};
function toast(m,w){const e=$('#toast');e.textContent=m;e.style.background=w?'var(--wn)':'var(--ac)';e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2400)}
(()=>{const p=new URLSearchParams(location.search);if(p.has('steps')||p.has('act')||p.has('w')){const L=S.log[today()]||(S.log[today()]={h:[]});if(p.has('steps'))L.steps=ni(p.get('steps'));if(p.has('act'))L.act=ni(p.get('act'));save();history.replaceState({},'',location.pathname)}})();
const ds=()=>Object.keys(S.log).filter(k=>S.log[k].w).sort();
const W=()=>{const k=ds();return k.length?S.log[k[k.length-1]].w:S.sw};
const lastB=()=>{const k=Object.keys(S.log).filter(k=>S.log[k].b).sort();return k.length?S.log[k[k.length-1]].b:null};
const age=()=>{const d=new Date(),b=new Date(S.dob);let a=d.getFullYear()-b.getFullYear();if(d<new Date(d.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const bmi=w=>w/((S.h/100)**2);
const kcal=()=>{const t=(10*W()+6.25*S.h-5*age()+5)*1.2;return Math.max(Math.round((t-Math.min(500,.2*t))/10)*10,1500)};
function trend(){let e=null,pk=null;const k=ds();if(!k.length)return[[today(),S.sw,S.sw]];return k.map(x=>{const w=S.log[x].w;if(e==null)e=w;else e+=(1-Math.pow(.7,Math.max(1,(new Date(x)-new Date(pk))/864e5)))*(w-e);pk=x;return[x,w,e]})}
function rate(){const t=trend();if(t.length<2)return null;const L=t[t.length-1],c=addDays(L[0],-28);let a=t[0];for(const r of t)if(r[0]<=c)a=r;const d=(new Date(L[0])-new Date(a[0]))/864e5;return d>=7?(L[2]-a[2])/d*7:null}
const f1=x=>{if(x==null)return '–';const r=Math.round(x*10)/10;return(r>0?'+':r<0?'−':'')+Math.abs(r).toFixed(1)};
const fl=(r,v)=>v==null?'':v<r[3]?'▼':v>r[4]?'▲':'';
const stp=k=>(S.log[k]||{}).steps||0;
const lastN=n=>{const a=[];for(let i=n-1;i>=0;i--)a.push(addDays(today(),-i));return a};
function fc(){const c=rate(),r=W()-S.tg;if(r<=0)return'<span class="tag good">Đã đạt mục tiêu</span>';if(c==null||c>-.05)return'';
 if(c<-.75)return'<span class="tag alert">Giảm nhanh hơn 0,75 kg/tuần. Tuần đầu thường là nước, đừng ăn quá ít.</span>';
 return'<span class="mu">Dự kiến đạt '+S.tg+' kg khoảng '+sd(addDays(today(),Math.round(r/-c*7)))+'</span>'}
function home(){const k0=ds(),lw=k0[k0.length-1]||S.sd,n=Math.round((new Date(today()+'T12:00:00')-new Date(lw+'T12:00:00'))/864e5),d=curDate,L=S.log[d]||{h:[]},w=W(),t=trend(),e=t[t.length-1][2],p=Math.max(0,Math.min(1,(S.sw-e)/(S.sw-S.tg))),st=L.steps||0;
 return `<div class="header"><h1>${dl(d)}</h1><button class="th" onclick="toggleTheme()">${theme==='dark'?'☀️':'🌙'}</button></div>
 <div class="card"><div class="big">${w.toFixed(1)}<small>kg</small></div><div class="mu">Mục tiêu ${S.tg} kg · xu hướng ${f1(rate())} kg/tuần</div><div class="mu">Lần cân cuối ${sd(lw)} (${n<=0?'hôm nay':n+' ngày trước'})${n>=7?' <span class="tag alert">Nên cân lại</span>':''}</div><div class="bar"><i style="width:${Math.round(p*100)}%"></i></div>${fc()}</div>
 <div class="card"><div class="row"><b>${fN(st)} / ${fN(S.sg)} bước</b><span style="text-align:right">${st>=S.sg?'<span class="tag good">✓ Đạt</span>':'<span class="mu">còn '+fN(S.sg-st)+'</span>'}</span></div><div class="bar"><i style="width:${Math.min(100,st/S.sg*100)}%"></i></div>
 <button class="g" style="width:100%" onclick="pasteData()">Dán số liệu từ Phím tắt</button></div>
 <div class="card">${Object.keys(HAB).map(id=>`<label class="hab"><input type="checkbox" ${(L.h||[]).includes(id)?'checked':''} onchange="tick('${id}')">${HAB[id]}</label>`).join('')}</div>
 <div class="card"><div class="mu">Giờ ăn ${S.eat[0]}–${S.eat[1]}</div><b id="iff"></b></div>
 <div class="card"><input id="idate" type="date" max="${today()}" value="${d}" onchange="curDate=this.value;render()">
 <div class="row"><div><div class="mu">Cân (kg)</div><input id="iw" type="number" step="0.1" inputmode="decimal" value="${L.w||''}"></div><div><div class="mu">Bụng (cm)</div><input id="ib" type="number" step="0.5" inputmode="decimal" value="${L.b||''}"></div><div><div class="mu">Bước</div><input id="ist" type="number" inputmode="numeric" value="${L.steps||''}"></div></div>
 <button style="width:100%" onclick="saveDay()">Lưu số đo</button></div>`}
function food(){const w=W();
 return `<div class="header"><h1>ĂN GÌ</h1></div><div class="card"><div class="row"><div><div class="mu">Đạm mỗi ngày</div><b>${Math.round(w*1.2)}–${Math.round(w*1.5)} g</b></div><div><div class="mu">Calo gợi ý</div><b>${kcal()}–${kcal()+100}</b></div></div><div class="mu" style="margin-top:8px">Đạm từ thịt nạc, gà, trứng, đậu phụ, cá. Uống nước theo khát, khoảng 2–2,5 L.</div></div>
 <h2>Ưu tiên</h2><div class="card"><div class="tip">Rau chiếm nửa đĩa ở cả 2 bữa. Chất xơ giúp no lâu và hỗ trợ giảm LDL.</div><div class="tip">Cá 2 lần/tuần giúp giảm triglycerid. Các bữa khác chọn thịt nạc, gà, trứng, đậu phụ.</div><div class="tip">Tinh bột nguyên hạt (gạo lứt, khoai, yến mạch) khoảng ¼ đĩa, bớt cơm trắng, bún, phở.</div></div>
 <h2>Hạn chế</h2><div class="card"><div class="tip no">Nội tạng và bia rượu: nhiều purin, acid uric của bạn đang sát giới hạn.</div><div class="tip no">Thịt chế biến (xúc xích, chả) và đồ chiên rán thường xuyên.</div><div class="tip no">Bữa lớn sát giờ ngủ: nên dời bữa tối sớm hơn.</div></div>`}
function hist(){const t=trend(),b0=(S.log[S.sd]||{}).b,b1=lastB(),d14=lastN(14),ok14=d14.filter(k=>stp(k)>=S.sg).length,ok7=lastN(7).filter(k=>stp(k)>=S.sg).length,hb7=lastN(7).filter(k=>((S.log[k]||{}).h||[]).length>=3).length;let ch='<div class="mu">Cần ít nhất 2 lần nhập cân.</div>';
 if(t.length>1){const r=t.slice(-60),Wd=320,H=130,P=14,x0=new Date(r[0][0]).getTime(),x1=new Date(r[r.length-1][0]).getTime(),al=r.flatMap(a=>[a[1],a[2]]),mn=Math.min(...al)-.5,mx=Math.max(...al)+.5,X=k=>P+(x1==x0?0:(new Date(k).getTime()-x0)/(x1-x0))*(Wd-2*P),Y=v=>H-P-(v-mn)/(mx-mn)*(H-2*P);
  ch=`<svg viewBox="0 0 ${Wd} ${H}"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${r.map(a=>X(a[0])+','+Y(a[2])).join(' ')}"/>${r.map(a=>`<circle cx="${X(a[0])}" cy="${Y(a[1])}" r="3" fill="var(--mu)"/>`).join('')}</svg><div class="row mu"><span>${sd(r[0][0])}</span><span style="text-align:right">${sd(r[r.length-1][0])}</span></div>`}
 const bw=16,g=(320-14*bw)/13,mxs=Math.max(S.sg*1.2,...d14.map(stp)),y=v=>96-v/mxs*88,sv=`<svg viewBox="0 0 320 96">${d14.map((k,i)=>`<rect x="${i*(bw+g)}" y="${y(stp(k))}" width="${bw}" height="${96-y(stp(k))}" rx="3" fill="${stp(k)>=S.sg?'var(--ac)':'var(--mu)'}" opacity="${stp(k)>=S.sg?1:.45}"/>`).join('')}<line x1="0" x2="320" y1="${y(S.sg)}" y2="${y(S.sg)}" stroke="var(--wn)" stroke-dasharray="4 4"/></svg>`;
 const LS=[...S.labs].sort((a,b)=>a.d<b.d?-1:1),A=LS[LS.length-1]||{v:{}},B=LS[LS.length-2],rt=x=>x&&x.v.tg&&x.v.hdl?x.v.tg/x.v.hdl:null,rA=rt(A),rB=rt(B);
 return `<div class="header"><h1>LỊCH SỬ</h1></div>
 <div class="card"><div class="mu">7 ngày qua</div><div class="row" style="margin-top:6px"><div><b>${ok7}/7</b><div class="mu">ngày đủ bước</div></div><div><b>${f1(rate())}</b><div class="mu">kg/tuần (xu hướng)</div></div><div><b>${hb7}/7</b><div class="mu">ngày làm ≥3 việc</div></div></div></div>
 <h2>Bước chân 14 ngày <span class="mu">(đạt ${ok14}/14)</span></h2><div class="card">${sv}<div class="mu">Đường cam: mục tiêu ${fN(S.sg)} bước</div></div>
 <h2>Cân nặng</h2><div class="card">${ch}</div><div class="card"><div class="mu">Từ ${sd(S.sd)}</div>Cân <b>${f1(W()-S.sw)} kg</b>${b0&&b1?` · bụng <b>${f1(b1-b0)} cm</b>`:''}</div>
 <h2>Theo ngày</h2><div class="card" style="overflow-x:auto"><table><tr><th>Ngày</th><th>Cân</th><th>Bụng</th><th>Bước</th><th>Calo</th><th>Việc</th></tr>${Object.keys(S.log).sort().reverse().slice(0,30).map(k=>{const L=S.log[k];return`<tr><td>${sd(k).slice(0,5)}</td><td>${L.w||'–'}</td><td>${L.b||'–'}</td><td>${L.steps?fN(L.steps)+(L.steps>=S.sg?' ✓':''):'–'}</td><td>${L.act||'–'}</td><td>${(L.h||[]).length}/4</td></tr>`}).join('')}</table></div>
 <h2>Xét nghiệm</h2><div class="card"><table><tr><th></th><th>${B?sd(B.d):''}</th><th>${sd(A.d)}</th></tr>${LAB.map(r=>{const a=A.v[r[0]],b=B&&B.v[r[0]];return`<tr><td>${r[1]} <span class="mu">${r[2]}</span></td><td>${b??'–'}</td><td class="${fl(r,a)?'up':''}"><b>${a??'–'}</b> ${fl(r,a)}</td></tr>`}).join('')}<tr><td>TG/HDL <span class="mu">tham khảo</span></td><td>${rB?rB.toFixed(1):'–'}</td><td class="${rA>3?'up':''}"><b>${rA?rA.toFixed(1):'–'}</b> ${rA>3?'▲':''}</td></tr></table><div class="mu" style="margin-top:8px">▲▼ ngoài mục tiêu tham khảo. Tái khám khoảng 3 tháng sau.</div></div>
 <details class="card"><summary>Thêm xét nghiệm mới</summary><input id="ld" type="date" max="${today()}" value="${today()}" style="margin-top:10px"><div class="row" style="flex-wrap:wrap">${LAB.map(r=>`<div style="flex:1 1 45%"><label class="mu">${r[1]} (${r[2]})</label><input id="l_${r[0]}" type="number" step="any" inputmode="decimal"></div>`).join('')}</div><button style="width:100%" onclick="addLab()">Lưu xét nghiệm</button></details>`}
function rep(){const t=trend(),w=W(),b=lastB(),d14=lastN(14),LS=[...S.labs].sort((a,b)=>a.d<b.d?-1:1),sv=d14.map(stp).filter(x=>x),avg=sv.length?Math.round(sv.reduce((a,b)=>a+b,0)/sv.length):'?';
 return `# Báo cáo sức khỏe (xuất ${sd(today())})

## Hồ sơ
- Nam, ${age()} tuổi, cao ${S.h} cm
- Mục tiêu: giảm về ${S.tg} kg một cách khoa học, giữ cơ thể khỏe
- Khởi điểm ${sd(S.sd)}: ${S.sw} kg, bụng ${(S.log[S.sd]||{}).b||'?'} cm
- Hiện tại: ${w.toFixed(1)} kg (xu hướng ${t[t.length-1][2].toFixed(1)}), BMI ${bmi(w).toFixed(1)}, bụng ${b||'?'} cm, bụng/cao ${b?(b/S.h).toFixed(2):'?'}
- Xu hướng cân: ${f1(rate())} kg/tuần (cân nhập thủ công khoảng mỗi tuần, lần cuối ${sd(ds().pop())})
- Giờ ăn kế hoạch: ${S.eat[0]}-${S.eat[1]}
- Lối sống: ${S.note}

## 14 ngày gần nhất (ngày | cân | bụng | bước | calo hoạt động | số việc/4)
${d14.map(k=>{const L=S.log[k]||{};return`${sd(k)} | ${L.w||'-'} | ${L.b||'-'} | ${L.steps||'-'} | ${L.act||'-'} | ${(L.h||[]).length}`}).join('\n')}
Bước trung bình: ${avg}/ngày (mục tiêu ${S.sg}). Số ngày đạt: ${d14.filter(k=>stp(k)>=S.sg).length}/14. Calo hoạt động từ iPhone là ước lượng thô.

## Xét nghiệm
${LS.map(x=>`${sd(x.d)}: `+LAB.filter(r=>x.v[r[0]]!=null).map(r=>`${r[1]} ${x.v[r[0]]} ${r[2]}`).join(', ')).join('\n')}

## Yêu cầu
Hãy phân tích dựa trên bằng chứng khoa học (hướng dẫn lâm sàng, meta-analysis). Nêu: (1) xu hướng đáng chú ý, (2) điều chỉnh ăn uống và vận động cụ thể, (3) chỉ số nên theo dõi hoặc tái khám, (4) điểm cần hỏi bác sĩ. Không chẩn đoán; nói rõ khi nào cần gặp bác sĩ.`}
function more(){return `<div class="header"><h1>THÊM</h1></div>
 <div class="card"><div class="mu">Ghi chú lối sống (đưa vào báo cáo)</div><textarea id="nt" rows="4" onchange="S.note=this.value;save();toast('✓ Đã lưu ghi chú')">${S.note}</textarea>
 <button style="width:100%" onclick="cp()">Sao chép báo cáo gửi AI</button><textarea id="rp" rows="6" readonly style="margin-top:10px" placeholder="Báo cáo hiện ở đây. Không có họ tên, số định danh, số điện thoại, địa chỉ."></textarea></div>
 <h2>Cài đặt</h2><div class="card"><div class="mu">Giờ ăn</div><div class="row"><input id="e1" type="time" value="${S.eat[0]}" onchange="setEat()"><input id="e2" type="time" value="${S.eat[1]}" onchange="setEat()"></div>
 <div class="row"><div><div class="mu">Cân mục tiêu (kg)</div><input id="tg" type="number" step="0.5" inputmode="decimal" value="${S.tg}" onchange="setTg()"></div><div><div class="mu">Bước mỗi ngày</div><input id="sg" type="number" step="500" inputmode="numeric" value="${S.sg}" onchange="setSg()"></div></div></div>
 <h2>Phím tắt iPhone</h2><div class="card"><div class="mu">Kết thúc phím tắt bằng "Sao chép vào bộ nhớ tạm" với nội dung (mỗi mục cách nhau dấu chấm phẩy):</div><div style="background:var(--bg);padding:10px;border-radius:8px;font-size:12px;word-break:break-all;color:var(--ac);margin-top:6px">ngay=[Ngày dạng yyyy-MM-dd];buoc=[Số bước];calo=[Năng lượng hoạt động]</div><div class="mu" style="margin-top:6px">Cân nặng nhập tay khoảng mỗi tuần, không lấy từ Sức khỏe. Sau đó mở app và bấm "Dán số liệu". Có ngày trong dòng nên dán sau nửa đêm vẫn ghi đúng ngày.</div></div>
 <h2>Sao lưu</h2><div class="card"><div class="row"><button onclick="exportFile()">Tải tệp (.json)</button><button class="g" onclick="$('#bk').value=JSON.stringify(S);$('#bk').select()">Hiện mã</button></div><textarea id="bk" rows="3" style="margin-top:10px" placeholder="Dán mã sao lưu để khôi phục"></textarea><button class="g" style="width:100%" onclick="impCode()">Khôi phục từ mã</button><input type="file" id="fi" accept=".json" onchange="impFile(event)" style="margin-top:10px"></div>
 <div class="card"><button class="w" style="width:100%" onclick="delAll()">${del?'Bấm lần nữa để xóa sạch':'Xóa tất cả dữ liệu'}</button></div>
 <div class="mu">Không thay thế tư vấn y tế. Dữ liệu chỉ lưu trên máy này.</div>`}
function saveDay(){const w=nf($('#iw').value),b=nf($('#ib').value),st=ni($('#ist').value),d=curDate;
 if((w&&!(w>=30&&w<=300))||(b&&!(b>=40&&b<=250))){toast('Cân 30–300 kg, bụng 40–250 cm',1);return}
 const L=S.log[d]||(S.log[d]={h:[]});if(w)L.w=Math.round(w*10)/10;if(b)L.b=b;if(st!=null)L.steps=st;save();render();toast('✓ Đã lưu ngày '+sd(d))}
function tick(id){const L=S.log[curDate]||(S.log[curDate]={h:[]}),i=L.h.indexOf(id);i<0?L.h.push(id):L.h.splice(i,1);save();toast('✓ Đã lưu')}
async function pasteData(){let t;try{t=await navigator.clipboard.readText()}catch(e){toast('Không đọc được bộ nhớ tạm. Hãy chọn Cho phép dán.',1);return}
 const m={};String(t).split(/[;\n]/).forEach(p=>{const i=p.indexOf('=');if(i>0)m[p.slice(0,i).trim().toLowerCase()]=p.slice(i+1).trim()});
 const st=ni(m.buoc),ca=ni(m.calo);let d=/^\d{4}-\d{2}-\d{2}$/.test(m.ngay||'')?m.ngay:today();if(d>today())d=today();
 if(st==null&&ca==null){toast('Không thấy số liệu trong bộ nhớ tạm',1);return}
 const L=S.log[d]||(S.log[d]={h:[]});if(st!=null)L.steps=st;if(ca!=null)L.act=ca;save();curDate=d;render();toast('✓ Đã nhận ngày '+sd(d)+(st!=null?': '+fN(st)+' bước':''))}
function addLab(){const d=$('#ld').value,v={};LAB.forEach(r=>{const x=nf($('#l_'+r[0]).value);if(x!=null)v[r[0]]=x});
 if(!d||!Object.keys(v).length){toast('Chọn ngày và nhập chỉ số',1);return}S.labs=S.labs.filter(x=>x.d!==d);S.labs.push({d,v});save();render();toast('✓ Đã lưu xét nghiệm')}
function cp(){const r=$('#rp');r.value=rep();r.select();const f=()=>toast('Hãy sao chép khung báo cáo bên dưới',1);try{navigator.clipboard.writeText(r.value).then(()=>toast('✓ Đã sao chép báo cáo'),f)}catch(e){f()}}
function setEat(){const a=$('#e1').value,b=$('#e2').value;if(!a||!b||a>=b){toast('Giờ kết thúc phải sau giờ bắt đầu',1);return}S.eat=[a,b];save();toast('✓ Đã lưu giờ ăn')}
function setTg(){const v=nf($('#tg').value);if(!(v>=50&&v<W())){toast('Mục tiêu từ 50 kg và thấp hơn cân hiện tại',1);return}S.tg=v;save();toast('✓ Đã lưu mục tiêu')}
function setSg(){const v=ni($('#sg').value);if(!(v>=1000&&v<=30000)){toast('Từ 1.000 đến 30.000 bước',1);return}S.sg=v;save();toast('✓ Đã lưu mục tiêu bước')}
function exportFile(){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S,null,1));a.download='songchuan_'+today()+'.json';a.click();toast('Nếu không tải được, dùng "Hiện mã"',1)}
function load(o){if(!valid(o))throw 0;S=o;S.v=4;S.sg=S.sg||7000;save();tab='h';render();toast('✓ Đã khôi phục dữ liệu')}
function impCode(){try{load(JSON.parse($('#bk').value))}catch(e){toast('Mã không hợp lệ',1)}}
function impFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{try{load(JSON.parse(x.target.result))}catch(err){toast('Tệp không hợp lệ',1)}};r.readAsText(f)}
function delAll(){if(!del){del=true;render();return}try{localStorage.removeItem(K)}catch(e){}S=DEF();save();del=false;tab='h';render();toast('Đã xóa dữ liệu',1)}
function setTab(t){tab=t;render();scrollTo(0,0)}
function tickIF(){const el=$('#iff');if(!el)return;const n=new Date(),m=n.getHours()*60+n.getMinutes(),[a,b]=S.eat.map(x=>{const[h,mm]=x.split(':').map(Number);return h*60+mm}),f=x=>Math.floor(x/60)+' giờ '+pad(x%60)+' phút';
 el.textContent=m>=a&&m<b?'Đang trong giờ ăn · còn '+f(b-m):'Đang nhịn '+f(m>=b?m-b:1440-b+m)+' · bữa đầu còn '+f(m<a?a-m:1440-m+a)}
function render(){$('#app').innerHTML=(bad?'<div class="card" style="color:var(--wn)">Không lưu được dữ liệu trên máy này. Dữ liệu sẽ mất khi đóng trang.</div>':'')+({h:home,f:food,l:hist,m:more}[tab])()+`<nav>${[['h','Hôm nay'],['l','Lịch sử'],['f','Ăn gì'],['m','Thêm']].map(a=>`<button class="${tab==a[0]?'on':''}" onclick="setTab('${a[0]}')">${a[1]}</button>`).join('')}</nav>`;tickIF()}
setInterval(tickIF,30000);render();
</script></body></html>
